spring:
  application:
    name: arvore-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arvore}
    username: ${DATABASE_USERNAME:arvore}
    password: ${DATABASE_PASSWORD:arvore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

arvore:
  auth:
    usuario: ${ARVORE_USUARIO:joao}
    senha-hash: ${ARVORE_SENHA_HASH:}
  jwt:
    # troque em producao: precisa ter pelo menos 32 caracteres (HS256 exige chave de 256 bits)
    segredo: ${ARVORE_JWT_SEGREDO:desenvolvimento-troque-este-segredo-antes-de-producao}
    expiracao-minutos: ${ARVORE_JWT_EXPIRACAO_MINUTOS:10080}
