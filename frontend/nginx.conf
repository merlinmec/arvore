server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # o backup completo sobe como um JSON só; o padrão do nginx (1 MB) não comporta anos de dados
        client_max_body_size 50m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets têm hash no nome, então podem ficar em cache pra sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota que não é arquivo cai no index.html e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
