name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Testes unitários e de integração; o Testcontainers usa o Docker do runner.
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Garante que as imagens do docker-compose continuam buildando.
      - run: docker compose build
        env:
          ARVORE_SENHA_HASH: ci
          ARVORE_JWT_SEGREDO: ci
      # E a imagem única da demonstração pública (render.yaml), com o frontend dentro do backend.
      - run: docker build -f Dockerfile.demo .
