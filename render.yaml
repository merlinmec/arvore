# Demonstração pública do Árvore no Render (plano gratuito), com o banco no Neon (gratuito).
# Passo a passo em docs/DEMO.md. Os valores "sync: false" são segredos colados no painel do Render.
services:
  - type: web
    name: arvore-demo
    runtime: docker
    plan: free
    region: oregon # mesma região do banco no Neon (us-west-2): cada consulta cruza menos rede
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    branch: master
    autoDeploy: true # o master só recebe código com a CI verde
    healthCheckPath: /api/demo/status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # O Render encaminha o tráfego para a porta desta variável; a aplicação escuta na 8080.
      - key: PORT
        value: "8080"
      # O plano gratuito tem 512 MB de RAM: heap limitado e GC serial (menos memória e threads).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError
      # Neon: URL JDBC do endpoint DIRETO (sem "-pooler" no host), com ?sslmode=require no fim.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Pool pequeno e que esvazia quando ninguém usa: o Neon só "dorme" (e não gasta as horas de
      # computação gratuitas) sem conexões abertas.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      # Assina os tokens dos visitantes. Sem ARVORE_SENHA_HASH, o login de verdade nunca passa.
      - key: ARVORE_JWT_SEGREDO
        generateValue: true
